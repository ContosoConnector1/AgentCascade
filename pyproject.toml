[project]
name = "agent-cascade"
version = "0.1.0"
description = "Customer-success agent on Microsoft 365 Copilot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_cascade"]

[tool.ruff]
line-length = 100
